name: CI

# ブランチへの push のたびに Windows でビルドとテストを回す
# (WPF のテストは Windows でしか動かないため。タグの push は release.yml が扱う)
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチへ続けて push したときは、前の実行を取り消して最新のコミットだけを確かめる
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 警告はエラー扱い(Directory.Build.props)なので、ビルドが通れば警告ゼロ。
      # RAWANALYZER_UI_SNAPSHOTS を渡すと、UI テストが窓の見た目を PNG に書き出す
      - name: Test
        shell: pwsh
        env:
          RAWANALYZER_UI_SNAPSHOTS: ${{ runner.temp }}/ui-snapshots
        run: |
          New-Item -ItemType Directory -Force -Path $env:RAWANALYZER_UI_SNAPSHOTS | Out-Null
          dotnet test RawAnalyzer.sln -c Release

      # 画面を開けない環境(クラウドなど)でも見た目を確かめられるよう、テストが失敗しても残す
      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: ${{ runner.temp }}/ui-snapshots
          if-no-files-found: ignore
          retention-days: 14
